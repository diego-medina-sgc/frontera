<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Aprender IA al ritmo en que la IA cambia.">
  <title>Frontera</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Frontera">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="progreso" hidden></div>

  <header id="barra" hidden>
    <span class="marca">Frontera</span>
    <nav id="nav">
      <button id="nav-hoy" aria-current="page">Hoy</button>
      <button id="nav-reto">Reto</button>
      <button id="nav-mapa">Mapa</button>
      <button id="nav-libros">Biblioteca</button>
    </nav>
    <span id="racha" class="racha" title="Semanas seguidas aprendiendo"></span>
    <button id="salir" class="link">Salir</button>
  </header>

  <main id="vista" aria-live="polite">
    <div class="cargando">Cargando…</div>
  </main>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
