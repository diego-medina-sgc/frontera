<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Frontera">
  <!-- La frontera: el piso de lo conocido, la subida, y el punto que
       todavia no alcanzaste. El punto va separado a proposito: es lo
       que falta, no lo que ya hiciste.
       Tres puntos y no cinco: a 48 pixeles, cinco es una mancha. -->
  <rect width="512" height="512" rx="112" fill="#15161a"/>
  <path d="M112 392 H400" stroke="#3a4030" stroke-width="18" stroke-linecap="round"/>
  <path d="M112 344 L236 292 L352 184"
        fill="none" stroke="#d7f24b" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="412" cy="140" r="42" fill="#d7f24b"/>
</svg>
